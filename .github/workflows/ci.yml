name: CI

on:
  push:
  pull_request:

jobs:
  elixir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.1.1"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Fetch deps
        run: mix deps.get
      - name: Check format
        run: mix format --check-formatted
      - name: Build assets
        run: |
          cd apps/aura_log_web
          mix assets.setup
          mix assets.build
      - name: Compile
        run: mix compile
      - name: Test
        run: mix test
      - name: Build production image
        run: docker compose -f infra/docker/docker-compose.prod.yml build auralog
      - name: Run production stack
        env:
          SECRET_KEY_BASE: ci-secret-key-base-0123456789abcdef0123456789abcdef0123456789abcdef
          AURALOG_INGEST_JWT_SECRET: ci-jwt-secret-change-me
        run: docker compose -f infra/docker/docker-compose.prod.yml up -d --wait
      - name: Smoke post-deploy
        env:
          AURALOG_INGEST_JWT_SECRET: ci-jwt-secret-change-me
          JWT_SUBJECT: ci-smoke
          JWT_TENANT: ci
        run: |
          chmod +x infra/docker/smoke_post_deploy.sh
          ./infra/docker/smoke_post_deploy.sh
      - name: Container logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.prod.yml logs --no-color
      - name: Trivy scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker-auralog:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
