apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auralog
  namespace: auralog
spec:
  podSelector:
    matchLabels:
      app: auralog
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 4000
        - protocol: UDP
          port: 9000
  egress:
    - {}
